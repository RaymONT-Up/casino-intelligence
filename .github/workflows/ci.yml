name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: casino_intelligence
          POSTGRES_USER: casino
          POSTGRES_PASSWORD: ci-only-password
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U casino -d casino_intelligence"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://casino:ci-only-password@127.0.0.1:54329/casino_intelligence
      API_URL: http://127.0.0.1:4000
      APP_ORIGIN: http://127.0.0.1:3000
      # Throwaway CI values; no external services or deployed environments.
      ADMIN_TOKEN: ci-only-api-token-00000000000000000000000
      SESSION_SECRET: ci-only-session-secret-000000000000000000
      ADMIN_PASSWORD: ci-only-editor-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare local environment file for scripts
        run: touch .env
      - run: pnpm db:migrate
      - run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
