services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casino_intelligence
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - casino-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino -d casino_intelligence"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  casino-data:
